<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #bg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; transform: scale(1.08); }
      /* warm sun bloom from the top-right, cool depth at the bottom */
      #sun { position: absolute; inset: 0;
             background: radial-gradient(circle at 78% 18%, rgba(255, 214, 150, 0.55), rgba(255, 190, 120, 0) 45%); }
      #depth { position: absolute; inset: 0;
               background: linear-gradient(to bottom, rgba(0, 0, 0, 0) 55%, rgba(2, 30, 48, 0.55)); }
      #glowL { position: absolute; left: -200px; top: 120px; width: 1300px; height: 820px; border-radius: 50%;
               background: radial-gradient(ellipse, rgba(0, 20, 40, 0.45), rgba(0, 20, 40, 0) 70%); }
      #player { position: absolute; right: 30px; bottom: -40px; height: 1000px;
                filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 3px #fff) drop-shadow(0 0 28px rgba(120, 230, 255, 0.85)); }
      #title { position: absolute; left: 70px; top: 150px; width: 1080px;
               filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.55)) drop-shadow(0 0 40px rgba(120, 230, 255, 0.35)); }
      #tag { position: absolute; left: 70px; top: 54px; padding: 14px 30px; border-radius: 999px;
             background: linear-gradient(90deg, #0b6e8f, #0a4f72); border: 4px solid #fff;
             font-family: "Montserrat", sans-serif; font-weight: 800; font-size: 40px; letter-spacing: 0.04em; color: #fff;
             box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="thumb" data-start="0" data-duration="1" data-width="1920" data-height="1080" data-no-timeline>
      <img id="bg" src="assets/bg2.jpg" alt="" />
      <div id="sun"></div>
      <div id="depth"></div>
      <div id="glowL"></div>
      <img id="player" src="assets/player.png" alt="" />
      <img id="title" src="assets/title3d_crop.png" alt="" />
      <div id="tag">JAVA + BEDROCK</div>
    </div>
  </body>
</html>
